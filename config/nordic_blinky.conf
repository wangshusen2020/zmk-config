# Nordic_Blinky - LE Test Fixture
# BLE Advertising Signal Source

CONFIG_ZMK_KEYBOARD_NAME="Nordic_Blinky"

# BLE Advertising / Broadcaster Mode
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CTLR_ADV_ENABLE=y

# Maximum TX Power (+8dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Minimal Configuration - No Keyboard Features
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_MOUSE=n

# BLE Connection Settings
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
# 开启 BLE 调试日志
CONFIG_BT_DEBUG_LOG=y
